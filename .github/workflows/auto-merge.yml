name: Enable pull request auto-merge

on:
  workflow_run:
    workflows:
      - Test and coverage
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.pull_requests[0].head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash
